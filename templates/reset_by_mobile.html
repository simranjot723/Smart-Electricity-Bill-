<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>⚡Smart Electricity Billing - Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      background: linear-gradient(135deg, #081a3a, #7c9bd1);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #b90101;
    }
    .navbar {
      background: linear-gradient(90deg, #295dcf, #dd2476);
    }
    .navbar-brand {
      font-weight: bold;
      font-size: 2.0rem;
      color: #fdfbf6 !important;
    }  
    .card { background: rgba(245,254,253,0.95); border-radius: 15px; padding: 25px; margin-top: 80px; }
    .btn:hover { opacity:0.9; transform:scale(1.02); transition:0.3s; }
    footer { margin-top:40px; text-align:center; color:rgb(129,8,8); }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <span class="navbar-brand h1">⚡Smart Electricity Billing </span>
    <span class="navbar-text">Reset Your Password By Mobile Number</span>
  </div>
</nav>
  <div class="card shadow-lg col-md-4 mx-auto">
    <h3 class="text-center text-danger">📱 Reset Password</h3>
     {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} text-center">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form action="/reset_by_mobile" method="POST">
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
        <input class="form-control" type="tel" name="mobile" placeholder="Enter Registered Mobile Number" pattern="[0-9]{10}" required>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input class="form-control" type="password" name="password" placeholder="Enter New Password" required>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
        <input class="form-control" type="password" name="confirm_password" placeholder="Confirm New Password" required>
      </div>
      <button class="btn btn-danger w-100"><i class="bi bi-send"></i> Reset Password</button>
    </form>
    <hr>
    <a href="/login" class="btn btn-secondary w-100"><i class="bi bi-box-arrow-in-left"></i> Back to Login</a>
  </div>
</body>
</html>
